name: collect

# Tallies Pact swap fees every few minutes and force-pushes the result as a
# single commit on the `data` branch (no history growth). The phone widget
# reads data/feed.json from raw.githubusercontent.com.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load previous state
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data; then git archive FETCH_HEAD | tar -x -C data; fi

      - name: Collect
        run: node collector/collect.mjs data

      - name: Publish data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git init -q -b data
          git add state.json feed.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
