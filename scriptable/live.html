<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pact Fees</title>
<link rel="icon" type="image/png" href="pact-icon.png" />
<style>
	:root {
		--bg: #0a0b12;
		--raised: rgba(19, 22, 31, 0.88);
		--overlay: #1e2130;
		--bright: #ffffff;
		--text: #c9cbd4;
		--muted: #7a7f91;
		--faint: #4a4f61;
		--hair: rgba(255, 255, 255, 0.07);
		--total: #0098d4;
		--proto: #bb8540;
		--gain: #4ade80;
		--accent: #00bfff;
		--accent-hi: #33ccff;
		--warn: #d9a055;
		/* reward tiers: tick → coin → nice → big → whale */
		--t1: #8fdcae;
		--t2: #4ade80;
		--t3: #33ccff;
		--t4: #f2c14e;
		--t5: #ffd978;
		--r: 4px;
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html { background: var(--bg); color: var(--text); }
	body {
		font: 15px/1.4 -apple-system, system-ui, 'Segoe UI', sans-serif;
		-webkit-font-smoothing: antialiased;
		-webkit-user-select: none;
		user-select: none;
		-webkit-tap-highlight-color: transparent;
		padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 28px);
		max-width: 560px;
		margin: 0 auto;
		overflow-x: hidden;
	}
	button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
	.num { font-family: ui-rounded, -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }

	/* Ambient liquidity ribbons (Pact motif). One composited layer that drifts;
	   brightens when fees land, and a gold twin flashes for big ones. */
	.ambient { position: fixed; left: -15%; top: -15%; width: 130%; height: 130%; z-index: -1; pointer-events: none; opacity: 0.38;
		transition: opacity 1.4s ease; animation: drift 42s ease-in-out infinite alternate; }
	.ambient.gold { opacity: 0; animation-duration: 55s; }
	.ambient.lit { opacity: 0.75; transition-duration: 0.12s; }
	.ambient.gold.lit { opacity: 0.85; }
	@keyframes drift { from { transform: translate3d(-3%, 2%, 0) scale(1.02); } to { transform: translate3d(3%, -2.5%, 0) scale(1.09); } }

	.top { position: relative; display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; z-index: 20; }
	.live { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: var(--muted); }
	.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
	.live.on .dot { background: var(--gain); animation: pulse 2.4s ease-out infinite; }
	.live.on { color: var(--text); }
	@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.55); } 80%, 100% { box-shadow: 0 0 0 9px rgba(74, 222, 128, 0); } }
	.top-right { display: flex; align-items: center; gap: 12px; }
	.since { font-size: 12px; color: var(--muted); }
	.icon-btn { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; border-radius: 3px;
		border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.03); color: var(--text); font-size: 12px; font-weight: 600; }
	.icon-btn svg { width: 17px; height: 17px; }
	.icon-btn .hint { display: none; color: var(--accent-hi); }
	.icon-btn.locked { border-color: rgba(0, 191, 255, 0.45); }
	.icon-btn.locked .hint { display: inline; }
	.icon-btn.locked svg { color: var(--accent-hi); }

	.pop { position: absolute; right: 0; top: 40px; width: 300px; padding: 14px; border-radius: var(--r); background: #141824;
		border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); }
	.pop::before { content: ''; position: absolute; left: -1px; right: -1px; top: -1px; height: 2px; background: var(--accent); border-radius: var(--r) var(--r) 0 0; }
	.pop-row { margin-bottom: 12px; }
	.pop-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
	.pop .seg { width: 100%; }
	.pop .seg button { flex: 1; }
	.pop input[type='range'] { width: 100%; accent-color: var(--accent); }
	.check { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--text); line-height: 1.35; cursor: pointer; }
	.check input { margin-top: 2px; accent-color: var(--accent); }
	.pv { display: flex; gap: 6px; }
	.pv button { flex: 1; height: 30px; border-radius: 3px; border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.03); font-size: 12px; font-weight: 600; }
	.pv button[data-pv='3'] { color: var(--t3); }
	.pv button[data-pv='4'] { color: var(--t4); }
	.pv button[data-pv='5'] { color: var(--t5); border-color: rgba(242, 193, 78, 0.35); }
	.pop-note { font-size: 11px; color: var(--muted); line-height: 1.4; }

	.hero { position: relative; margin-bottom: 18px; }
	.caption { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
	.odo-wrap { position: relative; display: inline-block; overflow: hidden; vertical-align: top; }
	.odo { display: flex; align-items: flex-end; font-size: clamp(40px, 12.5vw, 60px); font-weight: 700; color: var(--bright); letter-spacing: -0.02em; white-space: nowrap; transform-origin: left bottom; }
	.odo .c { display: inline-block; height: 1.12em; overflow: hidden; }
	.odo .col { display: flex; flex-direction: column; transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.25, 1); }
	.odo.fast .col { transition-duration: 0.08s; }
	.odo .col span, .odo .s { display: block; height: 1.12em; line-height: 1.12em; }
	.odo .sub { font-size: 0.52em; color: var(--muted); margin-bottom: 0.14em; }
	.odo .c.hit { animation: hit 0.9s ease-out; }
	@keyframes hit { 0% { color: var(--hit); text-shadow: 0 0 0.35em var(--hit); } 100% { text-shadow: 0 0 0 transparent; } }
	.odo.punch { animation: punch 0.6s cubic-bezier(0.2, 0.9, 0.25, 1); }
	@keyframes punch { 30% { transform: scale(1.045); } }
	.glint { position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; pointer-events: none; opacity: 0;
		background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.22) 50%, transparent); transform: skewX(-18deg); }
	.glint.go { animation: glint 0.95s cubic-bezier(0.3, 0.6, 0.3, 1); }
	@keyframes glint { 0% { left: -60%; opacity: 1; } 100% { left: 125%; opacity: 1; } }

	.float { position: absolute; top: 26px; font-weight: 800; pointer-events: none; white-space: nowrap; animation: rise 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
	.float.t1 { font-size: 14px; color: var(--t1); }
	.float.t2 { font-size: 17px; color: var(--t2); }
	.float.t3 { font-size: 22px; color: var(--t3); }
	.float.t4 { font-size: 30px; color: var(--t4); animation-duration: 2.1s; }
	.float.t5 { font-size: 44px; color: var(--t5); animation-duration: 2.8s; text-shadow: 0 0 24px rgba(242, 193, 78, 0.45); }
	@keyframes rise { 0% { opacity: 0; transform: translateY(12px) scale(0.92); } 12% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-52px); } }

	.combo { position: absolute; right: 0; top: -2px; display: inline-flex; align-items: baseline; gap: 5px; padding: 4px 10px; border-radius: 3px;
		border: 1px solid rgba(51, 204, 255, 0.4); background: rgba(0, 191, 255, 0.08); color: var(--t3); font-size: 11px; font-weight: 800;
		letter-spacing: 0.1em; opacity: 0; transform: translateY(-6px); transition: opacity 0.25s, transform 0.25s, color 0.25s, border-color 0.25s; }
	.combo b { font-size: 18px; letter-spacing: 0; }
	.combo.on { opacity: 1; transform: none; }
	.combo.bump { animation: cbump 0.32s ease-out; }
	@keyframes cbump { 40% { transform: scale(1.12); } }
	.combo.hot { color: var(--t4); border-color: rgba(242, 193, 78, 0.5); background: rgba(242, 193, 78, 0.08); }

	.gain { display: inline-flex; align-items: baseline; gap: 8px; margin-top: 8px; padding: 6px 12px; border-radius: var(--r);
		background: rgba(74, 222, 128, 0.08); border: 1px solid rgba(74, 222, 128, 0.24); }
	.gain .gv { font-size: 20px; font-weight: 700; color: var(--gain); }
	.gain .gl { font-size: 13px; color: var(--text); }
	.hud { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
	.hud span { font-size: 12px; color: var(--muted); padding: 4px 8px; border: 1px solid var(--hair); border-radius: 3px; background: rgba(255, 255, 255, 0.02); }
	.hud b { color: var(--bright); font-weight: 700; }
	.hud b.best { color: var(--t4); }

	.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
	.tile { position: relative; background: var(--raised); border: 1px solid var(--hair); border-radius: var(--r); padding: 10px 11px; min-width: 0; }
	.tl { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); display: flex; align-items: center; gap: 5px; }
	.tv { font-size: 18px; font-weight: 700; color: var(--bright); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.ts { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
	.sw.total { background: var(--total); }
	.sw.proto { background: var(--proto); }

	.card { position: relative; background: var(--raised); border: 1px solid var(--hair); border-radius: var(--r); padding: 14px 14px 12px; margin-bottom: 12px; }
	.card.edge::before { content: ''; position: absolute; left: -1px; right: -1px; top: -1px; height: 2px; background: var(--accent); border-radius: var(--r) var(--r) 0 0; }
	.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
	.card-title { font-size: 14px; font-weight: 600; color: var(--bright); }
	.sub { font-size: 12px; color: var(--muted); }
	.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; font-size: 12px; color: var(--muted); }
	.legend span { display: inline-flex; align-items: center; gap: 5px; }
	.legend b { color: var(--text); font-weight: 600; }
	.seg { display: flex; background: var(--overlay); border-radius: 3px; padding: 2px; flex: none; }
	.seg button { font: 600 12px -apple-system, system-ui, sans-serif; color: var(--muted); padding: 6px 10px; border-radius: 2px; }
	.seg button.on { background: #2a2f42; color: var(--bright); }

	.chart, .bars { position: relative; touch-action: pan-y; }
	svg { display: block; width: 100%; overflow: visible; }
	.axis { font: 10px -apple-system, system-ui, sans-serif; fill: var(--faint); }
	.grid { stroke: var(--hair); stroke-width: 1; }
	.tip { position: absolute; top: 0; pointer-events: none; opacity: 0; transition: opacity 0.12s; background: var(--overlay); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: var(--r); padding: 7px 9px; font-size: 12px; color: var(--text); white-space: nowrap; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); z-index: 3; }
	.tip.on { opacity: 1; }
	.tip .tt { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
	.tip .tr { display: flex; align-items: center; gap: 6px; }
	.tip .tr b { margin-left: auto; padding-left: 12px; color: var(--bright); font-weight: 600; }

	details { margin-top: 8px; }
	summary { font-size: 12px; color: var(--muted); cursor: pointer; }
	table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; }
	th { text-align: right; color: var(--muted); font-weight: 600; padding: 4px 0; border-bottom: 1px solid var(--hair); }
	th:first-child, td:first-child { text-align: left; }
	td { text-align: right; padding: 4px 0; border-bottom: 1px solid var(--hair); }

	.feed { list-style: none; }
	.feed li { --flash: rgba(74, 222, 128, 0.16); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 10px; padding: 8px 6px; margin: 0 -6px; border-radius: 3px; border-bottom: 1px solid var(--hair); }
	.feed li:last-child { border-bottom: 0; }
	.feed li.new { animation: flash 1.8s ease-out; }
	@keyframes flash { from { background: var(--flash); transform: translateY(-6px); } 25% { transform: none; } to { background: transparent; } }
	.fee { font-size: 15px; font-weight: 700; color: var(--t2); }
	.feed li.t0 { opacity: 0.5; }
	.feed li.t0 .fee { color: var(--muted); font-weight: 600; }
	.feed li.t1 .fee { color: var(--t1); }
	.feed li.t3 { --flash: rgba(51, 204, 255, 0.18); }
	.feed li.t3 .fee { color: var(--t3); }
	.feed li.t4, .feed li.t5 { --flash: rgba(242, 193, 78, 0.24); background: rgba(242, 193, 78, 0.05); box-shadow: inset 2px 0 0 var(--t4); }
	.feed li.t4 .fee, .feed li.t5 .fee { color: var(--t4); }
	.feed li.t5 .fee { font-size: 17px; color: var(--t5); }
	.pill { display: inline-block; margin-left: 6px; padding: 1px 5px; border-radius: 2px; font-size: 9px; font-weight: 800; font-style: normal; letter-spacing: 0.1em; vertical-align: 2px; color: #1a1406; background: var(--t4); }
	.pair { font-size: 13px; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.pair small { display: block; font-size: 11px; color: var(--muted); }
	.ago { font-size: 11px; color: var(--faint); }

	footer { font-size: 11px; color: var(--faint); line-height: 1.5; margin-top: 16px; }
	footer p + p { margin-top: 4px; }
	.warn { color: var(--warn); }

	#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 14px); transform: translate(-50%, calc(-100% - 48px)); transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
		background: #141824; border: 1px solid rgba(74, 222, 128, 0.35); color: var(--bright); padding: 10px 16px; border-radius: var(--r); font-weight: 600; font-size: 14px; white-space: nowrap; z-index: 30; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
	#toast.on { transform: translate(-50%, 0); }
	#toast.gold { border-color: rgba(242, 193, 78, 0.5); }
	#toast.gold b { color: var(--t4); }
	#toast small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }

	#whale { position: fixed; left: 50%; top: 42%; z-index: 31; min-width: 300px; padding: 22px 34px 20px; text-align: center; border-radius: var(--r); pointer-events: none;
		background: rgba(12, 13, 20, 0.94); border: 1px solid rgba(242, 193, 78, 0.45); box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
		opacity: 0; transform: translate(-50%, -50%) scale(0.86); transition: opacity 0.3s ease, transform 0.5s cubic-bezier(0.2, 0.9, 0.25, 1); }
	#whale::before { content: ''; position: absolute; left: -1px; right: -1px; top: -1px; height: 2px; background: var(--t4); border-radius: var(--r) var(--r) 0 0; }
	#whale.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
	#whale .wl { font-size: 12px; font-weight: 800; letter-spacing: 0.3em; color: var(--t4); }
	#whale .wv { margin-top: 6px; font-size: 68px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: var(--t5); }
	#whale .ws { margin-top: 10px; font-size: 13px; color: var(--muted); }

	#edge { position: fixed; inset: 0; pointer-events: none; z-index: 29; opacity: 0; box-shadow: inset 0 0 160px 12px var(--edge, rgba(242, 193, 78, 0.5)); }
	#edge.go { animation: edge 1.8s ease-out; }
	@keyframes edge { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
	#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 28; }
	.shake { animation: shake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
	@keyframes shake { 15% { transform: translate(-3px, 1px); } 30% { transform: translate(3px, -2px); } 45% { transform: translate(-2px, 2px); } 60% { transform: translate(2px, -1px); } 80% { transform: translate(-1px, 1px); } }

	/* Desktop: hero + charts on the left, live swaps docked on the right. */
	@media (min-width: 980px) {
		body { max-width: 1280px; padding: 28px 40px 36px; }
		.layout { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 20px; align-items: start; }
		.col-side { position: sticky; top: 20px; }
		.col-side .card { max-height: calc(100vh - 40px); overflow-y: auto; margin-bottom: 0; }
		.hero { margin-bottom: 24px; }
		.odo { font-size: 92px; }
		.tv { font-size: 24px; }
		.tile { padding: 14px 16px; }
		#whale .wv { font-size: 96px; }
	}

	@media (prefers-reduced-motion: reduce) {
		.odo .col { transition: none; }
		.ambient, .float, .feed li.new, .live.on .dot, .glint.go, .shake, .odo.punch { animation: none; }
	}
</style>
</head>
<body>
<svg class="ambient" id="ambient" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
	<defs>
		<linearGradient id="a1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00bfff" stop-opacity="0"/><stop offset=".55" stop-color="#00bfff" stop-opacity=".55"/><stop offset="1" stop-color="#33ccff" stop-opacity="0"/></linearGradient>
		<linearGradient id="a2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#687596" stop-opacity="0"/><stop offset=".5" stop-color="#5fa8d8" stop-opacity=".42"/><stop offset="1" stop-color="#687596" stop-opacity="0"/></linearGradient>
		<filter id="ab" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
	</defs>
	<path d="M-100 700 C 420 820, 980 500, 1720 640" fill="none" stroke="url(#a1)" stroke-width="8" filter="url(#ab)"/>
	<path d="M-100 540 C 500 760, 1100 360, 1720 470" fill="none" stroke="url(#a2)" stroke-width="6" filter="url(#ab)"/>
	<path d="M-100 260 C 460 420, 1140 160, 1720 330" fill="none" stroke="url(#a2)" stroke-width="5" filter="url(#ab)"/>
</svg>
<svg class="ambient gold" id="ambientGold" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
	<defs>
		<linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2c14e" stop-opacity="0"/><stop offset=".5" stop-color="#f2c14e" stop-opacity=".6"/><stop offset="1" stop-color="#ffd978" stop-opacity="0"/></linearGradient>
		<filter id="gb" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
	</defs>
	<path d="M-100 620 C 460 780, 1060 420, 1720 560" fill="none" stroke="url(#g1)" stroke-width="10" filter="url(#gb)"/>
	<path d="M-100 360 C 520 520, 1100 220, 1720 380" fill="none" stroke="url(#g1)" stroke-width="7" filter="url(#gb)"/>
</svg>

<header class="top">
	<div class="live" id="live"><span class="dot"></span><span id="liveLabel">SYNCING</span></div>
	<div class="top-right">
		<span class="since" id="since"></span>
		<button class="icon-btn" id="sndBtn" aria-label="Sound and alerts" aria-expanded="false" aria-controls="pop">
			<svg id="sndIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
			<span class="hint">Tap for sound</span>
		</button>
		<div class="pop" id="pop" hidden>
			<div class="pop-row">
				<div class="pop-label">Sound</div>
				<div class="seg" id="sndMode"><button data-m="off">Off</button><button data-m="big">Big</button><button data-m="coins">Coins</button><button data-m="all">All</button></div>
			</div>
			<div class="pop-row">
				<div class="pop-label">Volume</div>
				<input type="range" id="vol" min="0" max="1" step="0.05" aria-label="Volume" />
			</div>
			<label class="pop-row check" id="alertsRow" hidden><input type="checkbox" id="alerts" /> Desktop alert for fees of $0.25+ while this tab is in the background</label>
			<div class="pop-row">
				<div class="pop-label">Preview</div>
				<div class="pv"><button data-pv="2">Coin</button><button data-pv="3">Nice</button><button data-pv="4">Big</button><button data-pv="5">Whale</button></div>
			</div>
			<p class="pop-note">Big = fees of $0.25+ · Coins = $0.01+ · All = $0.001+. Sound keeps going while the tab is in the background.</p>
		</div>
	</div>
</header>

<main class="layout" id="layout">
<div class="col-main">
<section class="hero" id="hero">
	<div class="caption">Total fees earned</div>
	<div class="combo num" id="combo"><b id="comboN">×3</b>COMBO</div>
	<div class="odo-wrap"><div class="odo num" id="odo" aria-live="off"></div><div class="glint" id="glint"></div></div>
	<div><div class="gain"><span class="gv num" id="gainVal">+$0.00</span><span class="gl" id="gainLabel"></span></div></div>
	<div class="hud" id="hud"></div>
</section>

<section class="tiles">
	<div class="tile"><div class="tl"><i class="sw proto"></i>Protocol</div><div class="tv num" id="tProto">–</div><div class="ts" id="tProtoSub"></div></div>
	<div class="tile"><div class="tl">Today</div><div class="tv num" id="tToday">–</div><div class="ts" id="tTodaySub"></div></div>

<script>
'use strict';
const API = 'https://pact.fi/api/v1';
const ALGOD = 'https://mainnet-api.algonode.cloud';
const CHAIN = 'algorand-mainnet';
const FEED_URL = 'https://raw.githubusercontent.com/HumbleShaman/PactMobileTracker/data/feed.json';
const MAX_SWAP_USD = 5e6; // mirrors collector/fees.mjs
const POLL_MS = 5000;
const MILESTONES = [10, 25, 50, 100, 250, 500, 1e3, 2.5e3, 5e3, 1e4, 2.5e4, 5e4, 1e5, 2.5e5, 5e5, 1e6, 2.5e6, 5e6, 1e7];
// Per-swap fee tiers, calibrated on real Pact flow (Oct 2026: median fee $0.002,
// p99 $0.21, ~4 swaps/day pay $1+). Index = tier.
const TIER_MIN = [0, 0.001, 0.01, 0.05, 0.25, 1];
const TIER_NAME = ['dust', 'tick', 'coin', 'nice', 'big', 'whale'];
const TIER_COLOR = ['#7a7f91', '#8fdcae', '#4ade80', '#33ccff', '#f2c14e', '#ffd978'];
const MODE_MIN_TIER = { off: 99, big: 4, coins: 2, all: 1 };
const $ = (id) => document.getElementById(id);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const S = {
	feed: null,
	base: null,
	milestone: 0,
	pools: {},
	hours: new Map(), // hourStartSec -> [fee, proto, swaps]
	total: 0,
	proto: 0,
	recent: [],
	seen: new Set(),
	newestTs: 0,
	ready: false,
	gapSince: 0,
	range: 'all',
	lastOk: 0
};
const session = { fees: 0, n: 0, best: null, start: Date.now() };

// Opened in a normal browser (not Scriptable): the baseline lives in localStorage.
const LOCAL_KEY = 'pactTracker.base.v1';
const PREFS_KEY = 'pactTracker.prefs.v1';
let standalone = false;
let demoMode = false; // ?demo=1 adds fake fees, so it must never save a baseline
let shown = 0;
function loadLocal() {
	try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); } catch (e) { return null; }
}
function saveLocal() {
	if (!standalone || !S.ready || demoMode) return;
	try {
		localStorage.setItem(LOCAL_KEY, JSON.stringify({ total: S.total, at: Date.now(), genesis: S.feed.genesis, milestone: S.milestone }));
	} catch (e) {}
}
const prefs = (() => {
	const d = { mode: 'all', volume: 0.6, alerts: false };
	try { return Object.assign(d, JSON.parse(localStorage.getItem(PREFS_KEY) || '{}')); } catch (e) { return d; }
})();
function savePrefs() {
	try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
}

// Read by the Scriptable host every few seconds → next visit's baseline.
window.__pactState = () => (S.ready && !demoMode ? { total: S.total, milestone: S.milestone } : null);

// ─── formatting ───
function num(v, dp) {
	const parts = Math.abs(v).toFixed(dp).split('.');
	return (v < 0 ? '-' : '') + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (parts[1] ? '.' + parts[1] : '');
}
const money = (v, dp) => (v < 0 ? '-$' : '$') + num(Math.abs(v), dp == null ? 2 : dp);
const feeMoney = (v) => (v > 0 && v < 0.0001 ? '<$0.0001' : money(v, v < 1 ? 4 : 2));
const plusFee = (v) => (v > 0 && v < 0.0001 ? '<$0.0001' : '+' + feeMoney(v));
function compact(v) {
	const a = Math.abs(v);
	if (a >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
	if (a >= 1e3) return '$' + (v / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'K';
	return '$' + v.toFixed(a >= 10 ? 0 : a >= 1 ? 1 : 2);
}
const hourLabel = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric' });
const timeLabel = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const dayLabel = (ms) => new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' });
function whenLabel(ms) {
	const d = new Date(ms);
	const today = new Date();
	if (d.toDateString() === today.toDateString()) return timeLabel(ms);
	return d.toLocaleDateString([], { weekday: 'short' }) + ' ' + timeLabel(ms);
}
function ago(ms) {
	const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
	if (s < 60) return s + 's';
	if (s < 3600) return Math.floor(s / 60) + 'm';
	return Math.floor(s / 3600) + 'h';
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function tierOf(fee) {
	let t = 0;
	for (let i = 1; i < TIER_MIN.length; i++) if (fee >= TIER_MIN[i]) t = i;
	return t;
}

// ─── fee math (mirrors collector/fees.mjs) ───
async function getJSON(url) {
	const r = await fetch(url, { cache: 'no-store' });
	if (!r.ok) throw new Error('HTTP ' + r.status);
	return r.json();
}

async function readPoolSplit(poolId) {
	try {
		const app = await getJSON(ALGOD + '/v2/applications/' + poolId);
		const gs = {};
		for (const kv of (app.params && app.params['global-state']) || []) {
			if (kv.value.type === 2) gs[atob(kv.key)] = kv.value.uint;
		}
		if (gs.FEE_BPS != null) return [gs.FEE_BPS, gs.PACT_FEE_BPS || 0];
		if (gs.swap_fee_bps != null) return [gs.swap_fee_bps, (gs.swap_fee_bps * (gs.protocol_fee_bps || 0)) / 1e4];
	} catch (e) {}
	return null;
}

function swapFees(s, split) {
	const usd = Number(s.usdValue) || 0;
	if (!(usd > 0) || usd > MAX_SWAP_USD) return [0, 0];
	if (split) return [(usd * split[0]) / 1e4, (usd * split[1]) / 1e4];
	const ratio = (a, b) => {
		const v = Number(a) / Number(b);
		return isFinite(v) ? v : 0;
	};
	const onOut = s.feeAssetId === (s.tokenOut && s.tokenOut.assetId);
	const proto = ratio(s.protocolFee, onOut ? s.amountOut : s.amountIn) * usd;
	return [ratio(s.lpFee, s.amountIn) * usd + proto, proto];
}

async function price(list) {
	for (const s of list) {
		if (!(s.poolId in S.pools)) S.pools[s.poolId] = await readPoolSplit(s.poolId);
	}
	return list.map((s) => {
		const f = swapFees(s, S.pools[s.poolId]);
		return {
			id: s.id,
			ts: s.ts,
			pool: s.poolId,
			a: (s.tokenIn && s.tokenIn.symbol) || '?',
			b: (s.tokenOut && s.tokenOut.symbol) || '?',
			usd: Number(s.usdValue) || 0,
			fee: f[0],
			proto: f[1]
		};
	});
}

/** Unseen swaps with ts >= floorTs, oldest first. `reached` is false if maxPages ran out first. */
async function fetchSince(floorTs, maxPages) {
	const out = [];
	let cursor = null;
	for (let page = 0; page < maxPages; page++) {
		const j = await getJSON(API + '/swaps?chain=' + CHAIN + '&limit=100' + (cursor ? '&cursor=' + encodeURIComponent(cursor) : ''));
		const rows = j.data || [];
		for (const s of rows) {
			if (s.ts < floorTs) return { rows: out.reverse(), reached: true };
			if (!S.seen.has(s.id)) out.push(s);
		}
		cursor = j.meta && j.meta.page && j.meta.page.nextCursor;
		if (!cursor || !rows.length) return { rows: out.reverse(), reached: true };
	}
	return { rows: out.reverse(), reached: false };
}

// ─── state ───
function apply(r) {
	const h = Math.floor(r.ts / 1000 / 3600) * 3600;
	const b = S.hours.get(h) || [0, 0, 0];
	b[0] += r.fee;
	b[1] += r.proto;
	b[2] += 1;
	S.hours.set(h, b);
	S.total += r.fee;
	S.proto += r.proto;
	S.recent.unshift(r);
	if (S.recent.length > 40) S.recent.pop();
}

function sums() {
	const now = Date.now() / 1000;
	const midnight = new Date();
	midnight.setHours(0, 0, 0, 0);
	const m0 = midnight.getTime() / 1000;
	let today = 0, todayProto = 0, day = 0, dayProto = 0, daySwaps = 0;
	for (const [t, b] of S.hours) {
		if (t >= m0) { today += b[0]; todayProto += b[1]; }
		if (t >= now - 86400) { day += b[0]; dayProto += b[1]; daySwaps += b[2]; }
	}
	return { today, todayProto, day, dayProto, daySwaps };
}

/** Fees per hour over roughly the last 60 minutes (current hour + the tail of the previous one). */
function pace() {
	const nowS = Date.now() / 1000;
	const h = Math.floor(nowS / 3600) * 3600;
	const cur = (S.hours.get(h) || [0])[0];
	const prev = (S.hours.get(h - 3600) || [0])[0];
	return cur + prev * (1 - (nowS - h) / 3600);
}

/** Cumulative [tEndSec, total, proto] points from genesis. */
function cumulative() {
	const hourlyFrom = S.feed.hourlyFrom || 0;
	const now = Date.now() / 1000;
	const rows = Array.from(S.hours.entries()).sort((a, b) => a[0] - b[0]);
	const pts = [[S.feed.genesis, 0, 0]];
	let c = 0, p = 0;
	for (const [t, b] of rows) {
		c += b[0];
		p += b[1];
		pts.push([Math.min(t + (t < hourlyFrom ? 86400 : 3600), now), c, p]);
	}
	return pts;
}

// ─── sound: synthesized with Web Audio, nothing to download ───
const Sound = (() => {
	let ctx = null, master = null, verb = null, lastLow = 0;
	function init() {
		if (ctx) return ctx;
		const AC = window.AudioContext || window.webkitAudioContext;
		if (!AC) return null;
		ctx = new AC();
		const comp = ctx.createDynamicsCompressor();
		comp.threshold.value = -16;
		comp.ratio.value = 5;
		master = ctx.createGain();
		master.gain.value = prefs.volume;
		master.connect(comp);
		comp.connect(ctx.destination);
		// Small airy room from decaying noise, so chimes ring instead of click.
		verb = ctx.createConvolver();
		const len = Math.floor(ctx.sampleRate * 1.8);
		const buf = ctx.createBuffer(2, len, ctx.sampleRate);
		for (let ch = 0; ch < 2; ch++) {
			const d = buf.getChannelData(ch);
			for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4);
		}
		verb.buffer = buf;
		const wet = ctx.createGain();
		wet.gain.value = 0.28;
		verb.connect(wet);
		wet.connect(master);
		return ctx;
	}
	const ready = () => !!ctx && ctx.state === 'running';
	function unlock() {
		const c = init();
		if (c && c.state !== 'running') c.resume().then(updateSoundUi, () => {});
	}
	function tone(o) {
		const at = ctx.currentTime + (o.t || 0);
		const dur = o.dur || 0.3;
		const osc = ctx.createOscillator();
		osc.type = o.type || 'sine';
		osc.frequency.setValueAtTime(o.f, at);
		if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, at + dur);
		if (o.detune) osc.detune.value = o.detune;
		const g = ctx.createGain();
		g.gain.setValueAtTime(0.0001, at);
		g.gain.exponentialRampToValueAtTime(o.vol || 0.1, at + (o.attack || 0.004));
		g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
		osc.connect(g);
		g.connect(master);
		if (o.wet !== 0) {
			const s = ctx.createGain();
			s.gain.value = o.wet == null ? 0.35 : o.wet;
			g.connect(s);
			s.connect(verb);
		}
		osc.start(at);
		osc.stop(at + dur + 0.05);
	}
	// Bell: inharmonic partials decay at different rates.
	function bell(f, t, vol, dur) {
		[[1, 1], [2.76, 0.45], [5.4, 0.22], [8.93, 0.1]].forEach(([m, a], i) =>
			tone({ f: f * m, t, vol: vol * a, dur: dur / (1 + i * 0.6), wet: 0.5 }));
	}
	function noise(t, dur, vol, freq) {
		const at = ctx.currentTime + t;
		const len = Math.floor(ctx.sampleRate * dur);
		const buf = ctx.createBuffer(1, len, ctx.sampleRate);
		const d = buf.getChannelData(0);
		for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
		const src = ctx.createBufferSource();
		src.buffer = buf;
		const bp = ctx.createBiquadFilter();
		bp.type = 'bandpass';
		bp.frequency.value = freq;
		bp.Q.value = 1.4;
		const g = ctx.createGain();
		g.gain.setValueAtTime(vol, at);
		g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
		src.connect(bp);
		bp.connect(g);
		g.connect(master);
		src.start(at);
	}
	const C6 = 1046.5;
	const kinds = {
		tick(p) { tone({ f: 2093 * p, dur: 0.07, type: 'triangle', vol: 0.05, wet: 0.12 }); },
		coin(p) {
			tone({ f: 988 * p, dur: 0.09, type: 'square', vol: 0.035, wet: 0.1 });
			tone({ f: 1319 * p, t: 0.075, dur: 0.42, type: 'square', vol: 0.035, wet: 0.3 });
			tone({ f: 1319 * p, t: 0.075, dur: 0.5, type: 'sine', vol: 0.08 });
		},
		nice(p) {
			[1319, 1661, 1976, 2637].forEach((f, i) => tone({ f: f * p, t: i * 0.055, dur: 0.5, type: 'triangle', vol: 0.09 }));
			tone({ f: 3951 * p, t: 0.22, dur: 0.6, vol: 0.03, wet: 0.7 });
		},
		big() {
			noise(0, 0.06, 0.25, 3800); // the "ka"
			tone({ f: 110, to: 55, dur: 0.3, vol: 0.25, wet: 0 }); // thump
			[C6, C6 * 1.26, C6 * 1.5, C6 * 2].forEach((f, i) => bell(f, 0.06 + i * 0.012, 0.12, 1.5)); // "ching"
			[2093, 2637, 3136, 4186].forEach((f, i) => tone({ f, t: 0.35 + i * 0.07, dur: 0.4, type: 'triangle', vol: 0.04, wet: 0.6 }));
		},
		whale(scale) {
			const s = Math.min(1.6, 1 + Math.log10(Math.max(1, scale)) * 0.4);
			tone({ f: 70, to: 35, dur: 0.9, vol: 0.32, wet: 0 }); // sub drop
			noise(0, 0.5, 0.08, 6000); // air
			[523, 659, 784, 1047, 1319, 1568, 2093].forEach((f, i) => tone({ f, t: i * 0.06, dur: 0.35, type: 'triangle', vol: 0.09 }));
			const chord = [523, 659, 784, 1047];
			chord.forEach((f) => {
				tone({ f, t: 0.42, dur: 2.2 * s, type: 'sawtooth', vol: 0.025, detune: 7, wet: 0.6 });
				tone({ f, t: 0.42, dur: 2.2 * s, type: 'sawtooth', vol: 0.025, detune: -7, wet: 0.6 });
				bell(f * 2, 0.42, 0.08, 2.4 * s);
			});
			for (let i = 0; i < 14; i++) tone({ f: 2600 + Math.random() * 2600, t: 0.5 + Math.random() * 1.6 * s, dur: 0.25, vol: 0.025, wet: 0.8 });
		},
		milestone() {
			[523, 659, 784, 1047].forEach((f, i) => bell(f, i * 0.12, 0.1, 1.2));
			[1047, 1319, 1568, 2093].forEach((f) => bell(f, 0.55, 0.09, 2.2));
		}
	};
	function play(kind, p, scale) {
		if (!ready() || prefs.mode === 'off') return;
		master.gain.value = prefs.volume;
		// Keep fast bot bursts from smearing into noise.
		if (kind === 'tick' || kind === 'coin') {
			const now = performance.now();
			if (now - lastLow < 70) return;
			lastLow = now;
		}
		kinds[kind](p || 1, scale || 1);
	}
	/** Rapid rising ticks over `ms` (the opening/return count-up), ending in a chime sized by `tier`. */
	function countUp(ms, tier) {
		if (!ready() || prefs.mode === 'off' || ms < 300) return;
		const n = Math.min(40, Math.floor(ms / 55));
		for (let i = 0; i < n; i++) {
			const k = i / n;
			const t = (1 - Math.pow(1 - k, 1 / 3)) * (ms / 1000); // follow the ease-out curve
			tone({ f: 1400 * Math.pow(2, k * 0.9), t, dur: 0.05, type: 'triangle', vol: 0.03, wet: 0.08 });
		}
		const end = ['tick', 'tick', 'coin', 'nice', 'big', 'whale'][tier] || 'tick';
		setTimeout(() => kinds[end](1, 1), ms);
	}
	return { unlock, ready, play, countUp, init };
})();

// ─── particles ───
const FX = (() => {
	const c = $('fx');
	const g = c.getContext('2d');
	let parts = [];
	let raf = 0;
	function size() {
		const dpr = Math.min(2, window.devicePixelRatio || 1);
		c.width = innerWidth * dpr;
		c.height = innerHeight * dpr;
		g.setTransform(dpr, 0, 0, dpr, 0, 0);
	}
	size();
	addEventListener('resize', size);
	function loop() {
		const now = performance.now();
		g.clearRect(0, 0, innerWidth, innerHeight);
		parts = parts.filter((p) => now - p.born < p.life);
		for (const p of parts) {
			const k = (now - p.born) / p.life;
			p.vy += p.g;
			p.vx *= p.drag;
			p.vy *= p.drag;
			p.x += p.vx;
			p.y += p.vy;
			p.r += p.vr;
			g.globalAlpha = Math.max(0, 1 - Math.pow(k, 2.4));
			if (p.kind === 'spark') {
				g.fillStyle = p.c;
				g.beginPath();
				g.arc(p.x, p.y, p.s * (1 - k * 0.6), 0, 6.283);
				g.fill();
			} else if (p.kind === 'coin') {
				const w = Math.max(0.12, Math.abs(Math.cos(p.r))) * p.s;
				g.fillStyle = '#c8901f';
				g.beginPath();
				g.ellipse(p.x, p.y, w, p.s, 0, 0, 6.283);
				g.fill();
				g.fillStyle = '#ffd978';
				g.beginPath();
				g.ellipse(p.x - w * 0.12, p.y - p.s * 0.1, w * 0.72, p.s * 0.72, 0, 0, 6.283);
				g.fill();
			} else {
				g.save();
				g.translate(p.x, p.y);
				g.rotate(p.r);
				g.fillStyle = p.c;
				g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
				g.restore();
			}
		}
		g.globalAlpha = 1;
		raf = parts.length ? requestAnimationFrame(loop) : 0;
	}
	function burst(kind, x, y, n, colors) {
		if (REDUCED || document.hidden) return;
		const now = performance.now();
		for (let i = 0; i < n; i++) {
			const p = { kind, x, y, born: now, r: Math.random() * 6.28, c: colors[(Math.random() * colors.length) | 0] };
			if (kind === 'spark') {
				const a = Math.random() * 6.283, v = 2 + Math.random() * 5;
				Object.assign(p, { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, g: 0.06, drag: 0.95, vr: 0, s: 1.5 + Math.random() * 2, life: 550 + Math.random() * 450 });
			} else if (kind === 'coin') {
				const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, v = 6 + Math.random() * 7;
				Object.assign(p, { vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.34, drag: 0.992, vr: 0.18 + Math.random() * 0.25, s: 5 + Math.random() * 5, life: 1700 + Math.random() * 700 });
			} else {
				Object.assign(p, { vx: (Math.random() - 0.5) * 11, vy: -Math.random() * 12 - 4, g: 0.3, drag: 0.99, vr: (Math.random() - 0.5) * 0.3, s: 7 + Math.random() * 6, life: 2600 });
			}
			parts.push(p);
		}
		if (!raf) raf = requestAnimationFrame(loop);
	}
	return { burst };
})();

// ─── odometer ───
const odo = $('odo');
let odoText = '';
function odoString(v) {
	return '$' + num(v, 4);
}
/** Render v; with `hitTier`, digits that changed flash in that tier's colour. */
function setOdo(v, hitTier) {
	const str = odoString(v);
	const dot = str.indexOf('.');
	const prev = odoText;
	if (str.length !== odoText.length) {
		odo.innerHTML = '';
		for (let i = 0; i < str.length; i++) {
			const ch = str[i];
			const sub = i > dot + 2 ? ' sub' : '';
			if (/\d/.test(ch)) {
				const c = document.createElement('span');
				c.className = 'c' + sub;
				const col = document.createElement('span');
				col.className = 'col';
				col.innerHTML = '0123456789'.split('').map((d) => '<span>' + d + '</span>').join('');
				c.appendChild(col);
				odo.appendChild(c);
			} else {
				const s = document.createElement('span');
				s.className = 's' + sub;
				s.textContent = ch;
				odo.appendChild(s);
			}
		}
	}
	const kids = odo.children;
	for (let i = 0; i < str.length; i++) {
		const col = kids[i].firstChild;
		if (!col || col.className !== 'col') continue;
		col.style.transform = 'translateY(' + -1.12 * Number(str[i]) + 'em)';
		if (hitTier != null && prev.length === str.length && prev[i] !== str[i]) {
			const c = kids[i];
			c.style.setProperty('--hit', TIER_COLOR[Math.max(2, hitTier)]);
			c.classList.remove('hit');
			void c.offsetWidth;
			c.classList.add('hit');
		}
	}
	odoText = str;
	shown = v;
}

let tween = null;
function countTo(from, to, ms, done) {
	cancelAnimationFrame(tween);
	odo.classList.add('fast');
	const t0 = performance.now();
	const step = (now) => {
		const k = Math.min(1, (now - t0) / ms);
		const e = 1 - Math.pow(1 - k, 3);
		setOdo(from + (to - from) * e);
		setGain(from + (to - from) * e);
		if (k < 1) tween = requestAnimationFrame(step);
		else {
			odo.classList.remove('fast');
			if (done) done();
		}
	};
	tween = requestAnimationFrame(step);
}

function gainBase() {

const combo = { n: 0, last: 0 };
let comboTimer = null;
function bumpCombo() {
	const now = Date.now();
	combo.n = now - combo.last < 9000 ? combo.n + 1 : 1;
	combo.last = now;
	const el = $('combo');
	if (combo.n >= 3) {
		$('comboN').textContent = '×' + combo.n;
		el.classList.add('on');
		el.classList.toggle('hot', combo.n >= 10);
		el.classList.remove('bump');
		void el.offsetWidth;
		el.classList.add('bump');
	}
	clearTimeout(comboTimer);
	comboTimer = setTimeout(() => {
		combo.n = 0;
		el.classList.remove('on', 'hot');
	}, 9000);
}
/** Combos raise the pitch a semitone per hit, up to an octave. */
const comboPitch = () => Math.pow(2, Math.min(Math.max(combo.n - 1, 0), 12) / 12);

function odoAnchor() {
	const r = odo.getBoundingClientRect();

let titleFlash = null;
/** The celebration for one fee, scaled to its tier. Pass `preview` to leave stats alone. */
function reward(r, preview) {
	const t = tierOf(r.fee);
	if (!preview) {
		session.fees += r.fee;
		session.n += 1;
		if (!session.best || r.fee > session.best.fee) session.best = r;
		renderHud();
	}
	if (t >= 1) bumpCombo();
	if (t >= MODE_MIN_TIER[prefs.mode]) Sound.play(TIER_NAME[t], t <= 2 ? comboPitch() : 1, r.fee);

	if (document.hidden) {
		if (t >= 2) titleFlash = { text: plusFee(r.fee), until: Date.now() + 8000 };
		if (t >= 4) notify(r);
		return;
	}
	if (t === 0) return;
	if (t === 1) return floatTick(r.fee);
	floatAt(plusFee(r.fee), t);
	flashAmbient(false);
	const a = odoAnchor();
	if (t >= 3) {
		retrigger($('glint'), 'go');
		FX.burst('spark', a.x, a.y, t >= 4 ? 34 : 16, [TIER_COLOR[t], '#ffffff']);
	}
	if (t >= 4) {
		retrigger(odo, 'punch');
		flashAmbient(true);
		edgeGlow(t >= 5 ? 'rgba(255, 217, 120, 0.6)' : 'rgba(242, 193, 78, 0.42)');
		FX.burst('coin', a.x, a.y, t >= 5 ? 70 : 28, ['#f2c14e']);
	}
	if (t === 4) toast('Big fee <b class="num">+' + money(r.fee, 2) + '</b><small>' + esc(r.a) + ' → ' + esc(r.b) + ' · ' + money(r.usd) + ' swap</small>', true);
	if (t >= 5) {
		whaleBanner(r);
		FX.burst('confetti', innerWidth / 2, innerHeight * 0.35, 120, ['#f2c14e', '#ffd978', '#00bfff', '#33ccff', '#ffffff']);
		if (!REDUCED) retrigger($('layout'), 'shake');
	}
}

function niceMax(v) {
	if (v <= 0) return 1;
	const p = Math.pow(10, Math.floor(Math.log10(v)));
	for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
	return 10 * p;
}

function timeTicks(t0, t1) {
	const span = t1 - t0;
	const H = 3600;
	const step = span <= 30 * H ? 6 * H : span <= 3 * 86400 ? 12 * H : span <= 10 * 86400 ? 86400 : span <= 70 * 86400 ? 7 * 86400 : 30 * 86400;
	const out = [];
	// Align to local hour/day boundaries.
	const d = new Date(t0 * 1000);
	d.setMinutes(0, 0, 0);
	if (step >= 86400) d.setHours(0);
	else d.setHours(Math.ceil(d.getHours() / (step / H)) * (step / H));
	for (let t = d.getTime() / 1000; t <= t1; t += step) if (t >= t0) out.push(t);
	const fmt = step < 86400 ? (t) => hourLabel(t * 1000) : (t) => dayLabel(t * 1000);
	return out.map((t) => [t, fmt(t)]);
}

let chartPts = [];
function renderChart() {
	const svg = $('svg');
	const W = svg.clientWidth || 340;
	const H = innerWidth >= 980 ? 270 : 190;
	svg.setAttribute('height', H);
	const m = { l: 40, r: 8, t: 12, b: 22 };
	const now = Date.now() / 1000;
	const all = cumulative();
	all.push([now, S.total, S.proto]);
	const win = S.range === '24h' ? 86400 : S.range === '7d' ? 7 * 86400 : 0;
	let pts = all;
	if (win) {
		const start = Math.max(now - win, S.feed.genesis);
		// value at window start (linear between surrounding points)
		let i = all.findIndex((p) => p[0] >= start);
		if (i < 0) i = all.length - 1;
		const a = all[Math.max(0, i - 1)], b = all[i];
		const k = b[0] === a[0] ? 1 : (start - a[0]) / (b[0] - a[0]);
		const c0 = a[1] + (b[1] - a[1]) * k, p0 = a[2] + (b[2] - a[2]) * k;
		pts = [[start, 0, 0]].concat(all.slice(i).filter((p) => p[0] > start).map((p) => [p[0], p[1] - c0, p[2] - p0]));
	}
	chartPts = pts;
	const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
	const last = pts[pts.length - 1];
	const yMax = niceMax(last[1] * 1.08);
	const X = (t) => m.l + ((t - t0) / Math.max(1, t1 - t0)) * (W - m.l - m.r);
	const Y = (v) => m.t + (1 - v / yMax) * (H - m.t - m.b);

	$('chartTitle').textContent = win ? 'Fees earned · last ' + (S.range === '24h' ? '24 hours' : '7 days') : 'Fees earned since ' + dayLabel(S.feed.genesis * 1000);
	$('lgTotal').textContent = money(last[1]);
	$('lgProto').textContent = money(last[2]);

	let g = '';
	for (let i = 0; i <= 4; i++) {
		const v = (yMax / 4) * i;
		g += '<line class="grid" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>';
		g += '<text class="axis num" x="' + (m.l - 6) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' + compact(v) + '</text>';
	}
	for (const [t, label] of timeTicks(t0, t1)) {
		g += '<text class="axis" x="' + X(t) + '" y="' + (H - 6) + '" text-anchor="middle">' + label + '</text>';
	}
	const path = (idx) => pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[idx]).toFixed(1)).join('');
	const area = path(1) + 'L' + X(t1).toFixed(1) + ' ' + Y(0) + 'L' + X(t0).toFixed(1) + ' ' + Y(0) + 'Z';
	svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
	svg.innerHTML =
		'<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0098d4" stop-opacity=".28"/><stop offset="1" stop-color="#0098d4" stop-opacity="0"/></linearGradient></defs>' +
		g +
		'<path d="' + area + '" fill="url(#fill)"/>' +
		'<path d="' + path(2) + '" fill="none" stroke="#bb8540" stroke-width="2" stroke-linejoin="round"/>' +
		'<path d="' + path(1) + '" fill="none" stroke="#0098d4" stroke-width="2" stroke-linejoin="round"/>' +
		'<circle cx="' + X(t1) + '" cy="' + Y(last[2]) + '" r="4" fill="#bb8540" stroke="#13161f" stroke-width="2"/>' +
		'<circle cx="' + X(t1) + '" cy="' + Y(last[1]) + '" r="4.5" fill="#0098d4" stroke="#13161f" stroke-width="2"/>' +
		'<g id="xh" opacity="0"><line id="xl" y1="' + m.t + '" y2="' + (H - m.b) + '" stroke="rgba(255,255,255,.25)"/>' +
		'<circle id="xt" r="4.5" fill="#0098d4" stroke="#13161f" stroke-width="2"/><circle id="xp" r="4" fill="#bb8540" stroke="#13161f" stroke-width="2"/></g>';
	svg._geo = { X, Y, m, W, H };
}

function renderBars() {
	const svg = $('barsSvg');
	const W = svg.clientWidth || 340;
	const H = 110;
	const m = { l: 40, r: 8, t: 8, b: 20 };
	const nowH = Math.floor(Date.now() / 1000 / 3600) * 3600;
	const rows = [];
	for (let i = 23; i >= 0; i--) {
		const t = nowH - i * 3600;
		const b = S.hours.get(t) || [0, 0, 0];
		rows.push([t, b[0], b[1], b[2]]);
	}
	const yMax = niceMax(Math.max.apply(null, rows.map((r) => r[1])) * 1.05);
	const slot = (W - m.l - m.r) / rows.length;
	const bw = Math.max(2, slot - 2); // 2px surface gap between bars
	const Y = (v) => m.t + (1 - v / yMax) * (H - m.t - m.b);
	let g = '';
	for (let i = 0; i <= 2; i++) {
		const v = (yMax / 2) * i;
		g += '<line class="grid" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>';
		g += '<text class="axis num" x="' + (m.l - 6) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' + compact(v) + '</text>';
	}
	rows.forEach((r, i) => {
		const x = m.l + i * slot + 1;
		const y = Y(r[1]);
		const h = Math.max(0, Y(0) - y);
		const current = i === rows.length - 1;
		if (h > 0) {
			const rad = Math.min(4, bw / 2, h);
			// rounded top, square baseline
			g += '<path d="M' + x + ' ' + Y(0) + 'V' + (y + rad) + 'Q' + x + ' ' + y + ' ' + (x + rad) + ' ' + y + 'H' + (x + bw - rad) + 'Q' + (x + bw) + ' ' + y + ' ' + (x + bw) + ' ' + (y + rad) + 'V' + Y(0) + 'Z" fill="#0098d4"' + (current ? ' fill-opacity=".55"' : '') + '/>';
		}
		if (i % 6 === 0) g += '<text class="axis" x="' + (x + bw / 2) + '" y="' + (H - 5) + '" text-anchor="middle">' + hourLabel(r[0] * 1000) + '</text>';
	});
	svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
	svg.innerHTML = g + '<rect id="bh" y="' + m.t + '" height="' + (H - m.t - m.b) + '" fill="rgba(255,255,255,.06)" opacity="0"/>';
	svg._geo = { m, slot, rows };

	$('table').innerHTML =
		'<tr><th>Hour</th><th>Total</th><th>Protocol</th><th>Swaps</th></tr>' +
		rows.slice().reverse().map((r) => '<tr><td>' + hourLabel(r[0] * 1000) + '</td><td class="num">' + money(r[1]) + '</td><td class="num">' + money(r[2]) + '</td><td class="num">' + r[3].toLocaleString() + '</td></tr>').join('');
}

function tipRows(title, rows) {
	return '<div class="tt">' + title + '</div>' + rows.map((r) => '<div class="tr"><i class="sw ' + r[0] + '"></i>' + r[1] + '<b class="num">' + r[2] + '</b></div>').join('');

function placeTip(tip, box, x) {
	const w = tip.offsetWidth;
	tip.style.left = Math.max(0, Math.min(box.clientWidth - w, x - w / 2)) + 'px';
	tip.style.top = '-8px';
	tip.style.transform = 'translateY(-100%)';
}

function bindChart() {
	const box = $('chart'), svg = $('svg'), tip = $('tip');
	const move = (e) => {
		const geo = svg._geo;
		if (!geo || chartPts.length < 2) return;
		const rect = svg.getBoundingClientRect();
		const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
		let best = chartPts[0], bd = Infinity;
		for (const p of chartPts) {
			const d = Math.abs(geo.X(p[0]) - x);
			if (d < bd) { bd = d; best = p; }
		}
		const cx = geo.X(best[0]);
		const xh = svg.querySelector('#xh');
		xh.setAttribute('opacity', '1');
		svg.querySelector('#xl').setAttribute('x1', cx);
		svg.querySelector('#xl').setAttribute('x2', cx);
		svg.querySelector('#xt').setAttribute('cx', cx);
		svg.querySelector('#xt').setAttribute('cy', geo.Y(best[1]));
		svg.querySelector('#xp').setAttribute('cx', cx);
		svg.querySelector('#xp').setAttribute('cy', geo.Y(best[2]));
		tip.innerHTML = tipRows(whenLabel(best[0] * 1000), [['total', 'Total', money(best[1])], ['proto', 'Protocol', money(best[2])]]);
		tip.classList.add('on');
		placeTip(tip, box, cx);
	};
	const leave = () => {
		tip.classList.remove('on');
		const xh = svg.querySelector('#xh');
		if (xh) xh.setAttribute('opacity', '0');
	};
	box.addEventListener('pointermove', move);
	box.addEventListener('pointerdown', move);
	box.addEventListener('touchmove', move, { passive: true });
	box.addEventListener('pointerleave', leave);
	box.addEventListener('touchend', () => setTimeout(leave, 1200));
}

function bindBars() {
	const box = $('bars'), svg = $('barsSvg'), tip = $('btip');
	const move = (e) => {
		const geo = svg._geo;
		if (!geo) return;
		const rect = svg.getBoundingClientRect();
		const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
		const i = Math.max(0, Math.min(geo.rows.length - 1, Math.floor((x - geo.m.l) / geo.slot)));
		const r = geo.rows[i];
		const hl = svg.querySelector('#bh');
		hl.setAttribute('x', geo.m.l + i * geo.slot);
		hl.setAttribute('width', geo.slot);
		hl.setAttribute('opacity', '1');
		tip.innerHTML = tipRows(hourLabel(r[0] * 1000) + ' – ' + hourLabel((r[0] + 3600) * 1000), [['total', 'Total', money(r[1])], ['proto', 'Protocol', money(r[2])], ['', 'Swaps', r[3].toLocaleString()]]);
		tip.classList.add('on');
		placeTip(tip, box, geo.m.l + (i + 0.5) * geo.slot);
	};
	const leave = () => {
		tip.classList.remove('on');
		const hl = svg.querySelector('#bh');
		if (hl) hl.setAttribute('opacity', '0');
	};
	box.addEventListener('pointermove', move);
	box.addEventListener('pointerdown', move);
	box.addEventListener('touchmove', move, { passive: true });
	box.addEventListener('pointerleave', leave);
	box.addEventListener('touchend', () => setTimeout(leave, 1200));
}

function bindRange() {
	const buttons = $('range').querySelectorAll('button');
	const set = (r) => {
		S.range = r;
		buttons.forEach((b) => b.classList.toggle('on', b.dataset.r === r));
		try { localStorage.setItem('pactRange', r); } catch (e) {}
		renderChart();
	};
	buttons.forEach((b) => b.addEventListener('click', () => set(b.dataset.r)));
	let saved = 'all';
	try { saved = localStorage.getItem('pactRange') || 'all'; } catch (e) {}
	set(saved);
}

const ICON_ON = '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
const ICON_OFF = '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/>';
function updateSoundUi() {
	const on = prefs.mode !== 'off';
	$('sndIcon').innerHTML = on ? ICON_ON : ICON_OFF;
	$('sndBtn').classList.toggle('locked', on && !Sound.ready());
	$('sndMode').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.m === prefs.mode));
	$('vol').value = prefs.volume;
	$('alerts').checked = !!prefs.alerts && 'Notification' in window && Notification.permission === 'granted';
}

function bindSettings() {
	const pop = $('pop'), btn = $('sndBtn');
	const close = () => { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
	btn.addEventListener('click', (e) => {
		e.stopPropagation();
		pop.hidden = !pop.hidden;
		btn.setAttribute('aria-expanded', String(!pop.hidden));
	});
	document.addEventListener('click', (e) => { if (!pop.hidden && !pop.contains(e.target)) close(); });
	document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
	$('sndMode').querySelectorAll('button').forEach((b) =>
		b.addEventListener('click', () => {
			prefs.mode = b.dataset.m;
			savePrefs();
			updateSoundUi();
			if (prefs.mode !== 'off') Sound.play('coin', 1);
		}));
	$('vol').addEventListener('input', (e) => { prefs.volume = Number(e.target.value); savePrefs(); });
	$('vol').addEventListener('change', () => Sound.play('coin', 1));
	if (standalone && 'Notification' in window) {
		$('alertsRow').hidden = false;
		$('alerts').addEventListener('change', async (e) => {
			prefs.alerts = e.target.checked;
			if (prefs.alerts && Notification.permission !== 'granted') prefs.alerts = (await Notification.requestPermission()) === 'granted';
			savePrefs();
			updateSoundUi();
		});
	}
	pop.querySelectorAll('[data-pv]').forEach((b) =>
		b.addEventListener('click', () => {
			close();
			reward(sampleSwap(Number(b.dataset.pv)), true);
		}));
	// Browsers only allow audio after a tap or keypress on the page.
	const unlock = () => { Sound.unlock(); setTimeout(updateSoundUi, 50); };
	document.addEventListener('pointerdown', unlock, { capture: true });
	document.addEventListener('keydown', unlock, { capture: true });
	Sound.init();
	updateSoundUi();
}

// ─── milestones ───
function milestoneFor(v) {
	let m = 0;
	for (const x of MILESTONES) if (v >= x) m = x;
	return m;
}

function checkMilestone() {
	const m = milestoneFor(S.total);
	if (m > S.milestone) {
		const first = S.milestone === 0 && m > 1000; // don't fire for history on first ever open
		S.milestone = m;
		if (!first) celebrate(m);
	}
}

function celebrate(m) {
	toast('Milestone: <b class="num">' + money(m, 0) + '</b> in fees<small>since ' + dayLabel(S.feed.genesis * 1000) + '</small>', true, 5000);
	Sound.play('milestone');
	FX.burst('confetti', innerWidth / 2, innerHeight * 0.3, 160, ['#0098d4', '#00bfff', '#bb8540', '#f2c14e', '#4ade80', '#ffffff']);
	edgeGlow('rgba(0, 191, 255, 0.45)');
}

// ─── live loop ───
function setLive(state) {
	$('live').classList.toggle('on', state === 'LIVE');
	$('liveLabel').textContent = state;
}

/** Keep polling in a background tab only when that can still reach you (sound or alerts). */
const backgroundOn = () => (prefs.mode !== 'off' && Sound.ready()) || (prefs.alerts && 'Notification' in window && Notification.permission === 'granted');

let polling = false;
async function poll() {
	if (polling || (document.hidden && !backgroundOn())) return;
	polling = true;
	try {
		const { rows, reached } = await fetchSince(S.newestTs - 90000, reached0());
		S.lastOk = Date.now();
		setLive('LIVE');
		if (!reached) S.gapSince = S.gapSince || Date.now();
		if (rows.length) {
			const priced = await price(rows);
			for (const r of priced) S.seen.add(r.id);
			const tA = priced[0].ts, tB = priced[priced.length - 1].ts;
			S.newestTs = Math.max(S.newestTs, tB);
			if (priced.length > 40) {
				// Back from a while away: settle the backlog in one count-up, then
				// celebrate the biggest fee in it.
				const from = S.total;
				let top = priced[0];
				for (const r of priced) {
					apply(r);
					session.fees += r.fee;
					session.n += 1;
					if (r.fee > top.fee) top = r;
					if (!session.best || r.fee > session.best.fee) session.best = r;
				}
				Sound.countUp(1400, tierOf(S.total - from));
				countTo(from, S.total, 1400, () => {
					checkMilestone();
					if (tierOf(top.fee) >= 4) reward(top, true);
				});
				renderFeed();
				scheduleRender();
				return;
			}
			// Replay across the next poll window in real arrival order so the
			// counter ticks at the pace swaps actually landed.
			priced.forEach((r) => {
				const delay = priced.length === 1 ? 0 : ((r.ts - tA) / Math.max(1, tB - tA)) * (POLL_MS - 700);
				setTimeout(() => {
					apply(r);
					setOdo(S.total, tierOf(r.fee) >= 2 ? tierOf(r.fee) : null);
					setGain(S.total);
					reward(r);
					pushFeed(r);
					checkMilestone();
					scheduleRender();
				}, delay);
			});
		}
	} catch (e) {
		setLive('RECONNECTING');
	} finally {
		polling = false;
	}
}
// A long background stint can leave more than one page to catch up on.
const reached0 = () => (Date.now() - S.lastOk > 60000 ? 30 : 4);

async function boot() {
	let p = JSON.parse($('payload').textContent);
	const q = new URLSearchParams(location.search);
	if (typeof p === 'string') {
		// Opened outside Scriptable (browser / GitHub Pages): fetch the feed ourselves.
		standalone = true;
		const feed = await getJSON(q.get('feed') || FEED_URL);
		const saved = loadLocal();
		const mine = saved && saved.genesis === feed.genesis ? saved : null;
		const base = q.get('base')
			? { total: Number(q.get('base')), at: Date.now() - 3 * 3600e3 }
			: mine && { total: mine.total, at: mine.at };
		p = { feed, base, milestone: Number(q.get('milestone') || (mine && mine.milestone) || 0) };
	}
	S.feed = p.feed;
	S.base = p.base;
	S.milestone = p.milestone || 0;
	S.pools = Object.assign({}, p.feed.pools);
	for (const r of p.feed.series) S.hours.set(r[0], [r[1], r[2], r[3]]);
	S.total = p.feed.total;
	S.proto = p.feed.protocol;
	S.newestTs = p.feed.cursorTs;
	S.recent = p.feed.recent.slice();
	for (const r of S.recent) S.seen.add(r.id);

	const start = Math.min(gainBase(), S.total);
	setOdo(start);
	setGain(start);
	renderStatic();
	renderTiles();
	renderHud();
	renderFeed();
	renderFoot();
	bindRange();
	bindChart();
	bindBars();
	bindSettings();
	renderBars();

	// Catch up from the feed's cursor to now, then run the opening count-up.
	try {
		const { rows, reached } = await fetchSince(S.feed.cursorTs + 1, 40);
		if (!reached) S.gapSince = rows.length ? rows[0].ts : Date.now();
		const priced = await price(rows);
		for (const r of priced) {
			S.seen.add(r.id);
			apply(r);
			S.newestTs = Math.max(S.newestTs, r.ts);
		}
		S.lastOk = Date.now();
	} catch (e) {
		S.gapSince = Date.now();
	}
	S.ready = true;
	renderStatic();
	renderTiles();
	renderChart();
	renderBars();
	renderFeed();
	renderFoot();
	setLive('LIVE');
	const delta = S.total - start;
	const openMs = delta > 0.01 ? Math.min(3200, 1500 + Math.log10(1 + delta * 100) * 450) : 300;
	Sound.countUp(openMs, tierOf(delta));
	countTo(start, S.total, openMs, () => {
		// A good haul since last time gets its own moment.
		const t = tierOf(delta);
		if (t >= 3) {
			const a = odoAnchor();
			retrigger($('glint'), 'go');
			FX.burst(t >= 4 ? 'coin' : 'spark', a.x, a.y, t >= 4 ? 40 : 20, [TIER_COLOR[t], '#ffffff']);
			if (t >= 4) edgeGlow('rgba(242, 193, 78, 0.4)');
		}
		checkMilestone();
		setInterval(poll, POLL_MS);
		if (q.get('demo')) demo();
	});
	setInterval(() => {
		document.querySelectorAll('.ago[data-ts]').forEach((el) => (el.textContent = ago(Number(el.dataset.ts))));
		renderFoot();
	}, 1000);
	setInterval(renderHud, 30000); // pace drifts even without new fees
	addEventListener('resize', scheduleRender);

	// Running total in the tab title (with the latest fee while you're away),
	// and "since you last checked" counts from when you left the tab.
	setInterval(() => {
		const f = titleFlash && titleFlash.until > Date.now() ? titleFlash.text + ' · ' : '';
		document.title = f + money(shown) + ' · Pact fees';
	}, 1000);
	let leftAt = null;
	document.addEventListener('visibilitychange', () => {
		if (document.hidden) {
			leftAt = { total: S.total, at: Date.now(), bg: backgroundOn() };
			saveLocal();
			return;
		}
		titleFlash = null;
		if (renderDirty) {
			renderDirty = false;
			renderFeed();
			scheduleRender();
		}
		if (!leftAt || Date.now() - leftAt.at < 60000) return;
		// Long gaps without background polling: reload so the feed rebuilds from
		// fresh data; the saved baseline makes the reopen count up from where you left.
		if (standalone && !leftAt.bg && Date.now() - leftAt.at > 10 * 60000) return location.reload();
		S.base = leftAt;
		renderStatic();
		const gained = S.total - leftAt.total;
		if (gained > 0.005) {
			Sound.countUp(1600, tierOf(gained));
			countTo(leftAt.total, S.total, 1600);
		} else setGain(S.total);
		poll();
	});
	addEventListener('pagehide', saveLocal);
	setInterval(saveLocal, 15000);
}

/** ?demo=1 — fake fees on a realistic size curve, for previewing the effects. */
function demo() {
	demoMode = true;
	const next = () => {
		const u = Math.random();
		const fee = u < 0.015 ? 1 + Math.random() * 6 : u < 0.06 ? 0.25 + Math.random() * 0.6 : Math.pow(10, -3.5 + Math.random() * 2.8);
		const r = { id: 'demo' + Math.random(), ts: Date.now(), a: 'ALGO', b: 'USDC', usd: fee / 0.003, fee, proto: fee * 0.4 };
		apply(r);
		setOdo(S.total, tierOf(fee) >= 2 ? tierOf(fee) : null);
		setGain(S.total);
		reward(r);
		pushFeed(r);
		scheduleRender();
		setTimeout(next, 300 + Math.random() * 2200);
	};
	next();
}

boot().catch((e) => {
	setLive('OFFLINE');
	$('foot').innerHTML = '<p class="warn">Could not load fee data: ' + esc(e.message || e) + '</p>';
});
